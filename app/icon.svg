<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .back { fill: #565b66; fill-opacity: 0.35; }
    .mid { fill: #4f46e5; fill-opacity: 0.55; }
    .front { fill: #4f46e5; }
    .line { fill: #fcfcfc; }
    .line2 { fill: #fcfcfc; fill-opacity: 0.6; }
    .spark { fill: #ef5b36; }
    @media (prefers-color-scheme: dark) {
      .back { fill: #a1a4ae; }
      .mid, .front { fill: #8991ff; }
      .line, .line2 { fill: #0b0e1c; }
      .spark { fill: #f9875e; }
    }
  </style>
  <rect class="back" x="2" y="14" width="17" height="14" rx="3.5" />
  <rect class="mid" x="7.5" y="9" width="17" height="14" rx="3.5" />
  <rect class="front" x="13" y="4" width="17" height="14" rx="3.5" />
  <rect class="line" x="16.5" y="8" width="6.5" height="2" rx="1" />
  <rect class="line2" x="16.5" y="12" width="9.5" height="2" rx="1" />
  <rect class="spark" x="24.5" y="7" width="3" height="3" rx="0.75" />
</svg>
